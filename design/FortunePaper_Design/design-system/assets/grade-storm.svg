      <stop offset="0%" stop-color="#7C8C95"></stop>
      <stop offset="55%" stop-color="#546E7A"></stop>
      <stop offset="100%" stop-color="#2E3D45"></stop>
    </radialGradient>
    <radialGradient id="storm-cloud-back" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6B7E88"></stop>
      <stop offset="100%" stop-color="#3A4E58"></stop>
    </radialGradient>
    <linearGradient id="storm-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6B0"></stop>
      <stop offset="60%" stop-color="#FFD700"></stop>
