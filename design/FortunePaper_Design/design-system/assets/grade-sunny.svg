<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="sun-body" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF1A6"></stop>
      <stop offset="55%" stop-color="#FFD700"></stop>
      <stop offset="100%" stop-color="#E8B400"></stop>
    </radialGradient>
    <linearGradient id="sun-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE067"></stop>
      <stop offset="100%" stop-color="#FFB100"></stop>
    </linearGradient>
    <radialGradient id="hi-sunny" cx="35%" cy="28%" r="40%">
  <stop offset="0%" stop-color="#fff" stop-opacity="0.85"></stop>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"></stop>
</radialGradient>
    <filter id="drop-sunny" x="-25%" y="-15%" width="150%" height="150%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5"></feGaussianBlur>
  <feOffset dy="6" result="off"></feOffset>
  <feComponentTransfer><feFuncA type="linear" slope="0.22"></feFuncA></feComponentTransfer>
  <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
  </defs>
  <ellipse cx="120" cy="220" rx="68" ry="8" fill="#000" opacity="0.10"></ellipse>
  <g filter="url(#drop-sunny)">
    
    <g fill="url(#sun-ray)">
      
        <g transform="rotate(0 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(45 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(90 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(135 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(180 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(225 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(270 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
        <g transform="rotate(315 120 120)">
          <rect x="113" y="14" width="14" height="34" rx="7"></rect>
        </g>
    </g>
    
    <circle cx="120" cy="120" r="58" fill="url(#sun-body)"></circle>
    
    <ellipse cx="100" cy="100" rx="26" ry="18" fill="url(#hi-sunny)"></ellipse>
  </g>
</svg>